<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script
      type="text/javascript"
      src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"
    ></script>
    <style type="text/css">
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #mynetwork {
        width: 100%;
        height: 100%;
        background-color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="mynetwork"></div>
    <script type="text/javascript">
      // 创建节点
      var nodes = new vis.DataSet([
        { id: 1, label: "1.14 68.57 bg k", color: "#4CAF50" },
        { id: 2, label: "Node 2", color: "#2196F3" },
        { id: 3, label: "Node 3", color: "#F44336" },
      ]);

      // 创建边
      var edges = new vis.DataSet([
        { from: 1, to: 2, arrows: "to" },
        { from: 2, to: 3, arrows: "to" },
      ]);

      // 配置选项
      var options = {
        nodes: {
          shape: "dot",
          size: 30,
          font: {
            size: 14,
          },
          borderWidth: 2,
          shadow: true,
        },
        edges: {
          width: 2,
          shadow: true,
        },
        physics: {
          enabled: true,
          barnesHut: {
            gravitationalConstant: -2000,
            springLength: 200,
          },
        },
      };

      // 创建网络
      var container = document.getElementById("mynetwork");
      var data = {
        nodes: nodes,
        edges: edges,
      };
      var network = new vis.Network(container, data, options);

      // 添加点击事件
      network.on("click", function (params) {
        if (params.nodes.length > 0) {
          var nodeId = params.nodes[0];
          // 调用Android方法
          if (window.Android) {
            window.Android.onNodeClick(nodeId);
          }
        }
      });
    </script>
  </body>
</html>
